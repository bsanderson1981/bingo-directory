<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Review Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar for state list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #0d9488;
        }
    </style>
</head>
<body class="p-8 max-w-7xl mx-auto">
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-teal-400 mb-2">📋 Manual Review Checklist</h1>
        <p class="text-slate-400 text-lg">Below are scraped events that did not meet the direct ingestion criteria. Review them manually before adding.</p>
        <div class="mt-4 flex justify-center gap-4">
            <a href="/" class="text-teal-400 hover:underline font-bold">&larr; Back to Directory Search</a>
        </div>
    </header>

    <main class="flex flex-col lg:flex-row gap-8">
        <!-- Sidebar: States Queue -->
        <aside class="w-full lg:w-72 flex-shrink-0">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg lg:sticky lg:top-6">
                <h2 class="text-xl font-bold text-teal-400 mb-4 flex items-center justify-between border-b border-slate-700 pb-3">
                    <span>States Queue</span>
                    <span id="state-queue-total" class="text-xs bg-slate-900 text-teal-300 px-2.5 py-1 rounded-full font-bold">0</span>
                </h2>
                <div id="state-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Dynamic state buttons -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 min-w-0">
            <!-- Controls -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg mb-4 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-4 items-center">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1">Filter by Reason</label>
                        <select id="reason-filter" class="bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-2 focus:ring-2 focus:ring-teal-500">
                            <option value="">All Reasons</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-1">Filter by City</label>
                        <select id="city-filter" class="bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-2 focus:ring-2 focus:ring-teal-500 font-medium">
                            <option value="">All Cities</option>
                        </select>
                    </div>
                </div>
                <div class="text-slate-400 font-semibold" id="stats">
                    Showing 0 of 0 events
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/60 shadow-md mb-8 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="select-all" class="w-5 h-5 rounded border-slate-700 text-teal-600 focus:ring-teal-500 bg-slate-900 cursor-pointer">
                    <label for="select-all" class="text-sm font-semibold text-slate-300 cursor-pointer select-none">Select All Visible</label>
                    
                    <span class="text-slate-600 font-light mx-2">|</span>
                    
                    <label class="text-sm font-semibold text-slate-300">Bulk Action:</label>
                    <select id="bulk-action" class="bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-1.5 focus:ring-2 focus:ring-teal-500 text-sm font-semibold">
                        <option value="add">Add to Main Directory</option>
                        <option value="hide">Hide from Review List</option>
                    </select>
                    
                    <button id="apply-bulk" class="px-5 py-1.5 bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-bold rounded-xl transition-colors text-sm shadow-md">
                        Apply Action
                    </button>
                </div>
                <div id="selection-counter" class="text-slate-400 text-sm font-medium">
                    0 items selected
                </div>
            </div>

            <!-- Events List -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="events-grid">
                <!-- Dynamic items go here -->
            </div>
        </div>
    </main>

    <script>
        let allEvents = [];
        let activeEvents = [];
        let selectedState = ""; // Track currently selected state

        const stateNames = {
            "AL": "Alabama", "AK": "Alaska", "AZ": "Arizona", "AR": "Arkansas", "CA": "California",
            "CO": "Colorado", "CT": "Connecticut", "DE": "Delaware", "FL": "Florida", "GA": "Georgia",
            "HI": "Hawaii", "ID": "Idaho", "IL": "Illinois", "IN": "Indiana", "IA": "Iowa",
            "KS": "Kansas", "KY": "Kentucky", "LA": "Louisiana", "ME": "Maine", "MD": "Maryland",
            "MA": "Massachusetts", "MI": "Michigan", "MN": "Minnesota", "MS": "Mississippi", "MO": "Missouri",
            "MT": "Montana", "NE": "Nebraska", "NV": "Nevada", "NH": "New Hampshire", "NJ": "New Jersey",
            "NM": "New Mexico", "NY": "New York", "NC": "North Carolina", "ND": "North Dakota", "OH": "Ohio",
            "OK": "Oklahoma", "OR": "Oregon", "PA": "Pennsylvania", "RI": "Rhode Island", "SC": "South Carolina",
            "SD": "South Dakota", "TN": "Tennessee", "TX": "Texas", "UT": "Utah", "VT": "Vermont",
            "VA": "Virginia", "WA": "Washington", "WV": "West Virginia", "WI": "Wisconsin", "WY": "Wyoming"
        };

        function isHidden(item) {
            if (item.hidden) return true;
            const key = `hide_${item.name}_${item.city}`;
            return localStorage.getItem(key) === 'true';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function loadEvents() {
            try {
                const response = await fetch('/data/manual_review.json');
                if (!response.ok) throw new Error('Failed to load manual review data');
                allEvents = await response.json();
                
                // Load all items (including hidden ones)
                activeEvents = allEvents;
                
                populateFilters();
                renderStateSidebar();
                renderEvents();
            } catch (err) {
                console.error(err);
                document.getElementById('events-grid').innerHTML = `
                    <div class="col-span-full bg-red-900/50 border border-red-700 text-red-200 p-6 rounded-2xl text-center">
                        <h2 class="text-xl font-bold mb-2">Error Loading Data</h2>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        function renderStateSidebar() {
            const stateCounts = {};
            
            activeEvents.forEach(item => {
                if (isHidden(item)) return; // Only count unreviewed items
                const state = (item.state || "Unknown").toUpperCase().trim();
                stateCounts[state] = (stateCounts[state] || 0) + 1;
            });

            const stateListDiv = document.getElementById('state-list');
            
            // Get sorted list of states that have at least 1 waiting review, plus selectedState if it has 0
            const statesWithItems = Object.keys(stateCounts).filter(st => stateCounts[st] > 0);
            if (selectedState && !statesWithItems.includes(selectedState)) {
                statesWithItems.push(selectedState);
            }
            
            statesWithItems.sort((a, b) => {
                const nameA = stateNames[a] || a;
                const nameB = stateNames[b] || b;
                return nameA.localeCompare(nameB);
            });

            const totalWaiting = Object.values(stateCounts).reduce((a, b) => a + b, 0);
            document.getElementById('state-queue-total').textContent = totalWaiting;

            let html = `
                <button onclick="selectState('')" class="w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center justify-between ${
                    selectedState === '' 
                    ? 'bg-teal-600 text-white font-bold shadow-md shadow-teal-900/30' 
                    : 'bg-slate-900/50 hover:bg-slate-900 text-slate-300 hover:text-white border border-slate-700/50'
                }">
                    <span>🌐 All States</span>
                    <span class="text-xs ${selectedState === '' ? 'bg-teal-700 text-white' : 'bg-slate-800 text-slate-400'} px-2 py-0.5 rounded-md font-bold">${totalWaiting}</span>
                </button>
            `;

            statesWithItems.forEach(state => {
                const count = stateCounts[state] || 0;
                const fullName = stateNames[state] || state;
                const isActive = selectedState === state;

                html += `
                    <button onclick="selectState('${state}')" class="w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center justify-between ${
                        isActive 
                        ? 'bg-teal-600 text-white font-bold shadow-md shadow-teal-900/30' 
                        : 'bg-slate-900/50 hover:bg-slate-900 text-slate-300 hover:text-white border border-slate-700/50'
                    }">
                        <span class="truncate pr-2">🇺🇸 <span class="font-bold mr-1">${state}</span> ${fullName}</span>
                        <span class="text-xs ${isActive ? 'bg-teal-700 text-white' : 'bg-slate-800 text-slate-400'} px-2 py-0.5 rounded-md font-bold">${count}</span>
                    </button>
                `;
            });

            stateListDiv.innerHTML = html;
        }

        function selectState(state) {
            selectedState = state;
            
            // Reset city filter since the cities will change when selecting a state
            document.getElementById('city-filter').value = "";
            
            populateFilters();
            renderStateSidebar();
            renderEvents();
        }

        function populateFilters() {
            const reasonSelect = document.getElementById('reason-filter');
            const citySelect = document.getElementById('city-filter');
            
            const savedReason = reasonSelect.value;
            const savedCity = citySelect.value;

            const reasons = new Set();
            const cities = new Set();

            activeEvents.forEach(item => {
                if (item.reason) reasons.add(item.reason);
                
                // If selectedState is set, only add cities from that state
                if (!selectedState || (item.state && item.state.toUpperCase().trim() === selectedState)) {
                    if (item.city) cities.add(item.city);
                }
            });

            reasonSelect.innerHTML = '<option value="">All Reasons</option>';
            reasons.forEach(reason => {
                const opt = document.createElement('option');
                opt.value = reason;
                opt.textContent = reason;
                reasonSelect.appendChild(opt);
            });

            citySelect.innerHTML = '<option value="">All Cities</option>';
            Array.from(cities).sort().forEach(city => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySelect.appendChild(opt);
            });

            // Restore selection if it's still available
            if (reasons.has(savedReason)) {
                reasonSelect.value = savedReason;
            }
            if (cities.has(savedCity)) {
                citySelect.value = savedCity;
            }

            reasonSelect.removeEventListener('change', renderEvents);
            citySelect.removeEventListener('change', renderEvents);
            reasonSelect.addEventListener('change', renderEvents);
            citySelect.addEventListener('change', renderEvents);
        }

        function updateSelectionCounter() {
            const checkedBoxes = document.querySelectorAll('.event-checkbox:checked');
            document.getElementById('selection-counter').textContent = `${checkedBoxes.length} items selected`;
            
            const allVisibleBoxes = document.querySelectorAll('.event-checkbox');
            const selectAllCheckbox = document.getElementById('select-all');
            
            if (allVisibleBoxes.length > 0 && checkedBoxes.length === allVisibleBoxes.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else if (checkedBoxes.length > 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            }
        }

        function renderEvents() {
            const reasonFilter = document.getElementById('reason-filter').value;
            const cityFilter = document.getElementById('city-filter').value;
            const grid = document.getElementById('events-grid');
            
            const filtered = activeEvents.filter(item => {
                const matchesState = selectedState ? (item.state && item.state.toUpperCase().trim() === selectedState) : true;
                const matchesReason = reasonFilter ? item.reason === reasonFilter : true;
                const matchesCity = cityFilter ? item.city === cityFilter : true;
                return matchesState && matchesReason && matchesCity;
            });

            // Sort: Unhidden items first, Hidden items second (sorted A-Z)
            filtered.sort((a, b) => {
                const aHidden = isHidden(a);
                const bHidden = isHidden(b);
                
                if (aHidden && !bHidden) return 1;
                if (!aHidden && bHidden) return -1;
                if (aHidden && bHidden) {
                    return (a.name || '').localeCompare(b.name || '');
                }
                return 0;
            });

            const stateLabel = selectedState ? ` in ${selectedState}` : "";
            const stateEvents = selectedState 
                ? activeEvents.filter(item => item.state && item.state.toUpperCase().trim() === selectedState)
                : activeEvents;
            const totalUnhiddenCount = stateEvents.filter(item => !isHidden(item)).length;
            document.getElementById('stats').textContent = `Showing ${filtered.length} of ${stateEvents.length} events${stateLabel} (${totalUnhiddenCount} unreviewed)`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center text-slate-400">
                        No events match current filters.
                    </div>
                `;
                document.getElementById('select-all').checked = false;
                document.getElementById('select-all').indeterminate = false;
                updateSelectionCounter();
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const badgeColor = item.reason && item.reason.includes('Annual') ? 'bg-amber-900/60 text-amber-300 border-amber-800' : 'bg-red-900/60 text-red-300 border-red-800';
                const itemHidden = isHidden(item);
                
                const cardClasses = itemHidden 
                    ? "bg-slate-900/60 border-slate-800 rounded-2xl p-6 shadow-md transition-all flex flex-col justify-between relative opacity-40 grayscale-[30%]" 
                    : "bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-md hover:shadow-xl hover:border-slate-600 transition-all flex flex-col justify-between relative";
                
                const checkboxHtml = itemHidden
                    ? `<input type="checkbox" checked disabled class="w-5 h-5 rounded border-slate-805 text-slate-600 bg-slate-950 cursor-not-allowed">`
                    : `<input type="checkbox" class="event-checkbox w-5 h-5 rounded border-slate-700 text-teal-600 focus:ring-teal-500 bg-slate-900 cursor-pointer" data-name="${escapeHtml(item.name)}" data-city="${escapeHtml(item.city)}">`;

                const actionButtonHtml = itemHidden
                    ? `<button disabled class="px-4 py-2 bg-slate-800 border border-slate-700 text-slate-500 font-bold rounded-xl text-sm flex items-center justify-center gap-1.5 cursor-not-allowed">
                          👁️‍🗨️ Hidden
                       </button>`
                    : `<button onclick="hideEvent('${escapeHtml(item.name)}', '${escapeHtml(item.city)}')" class="px-4 py-2 bg-slate-700 hover:bg-red-950/80 hover:text-red-300 hover:border-red-900 border border-slate-600 text-slate-300 font-bold rounded-xl transition-all text-sm flex items-center justify-center gap-1.5" title="Hide event and exclude from future scrapes">
                          👁️‍🗨️ Hide
                       </button>`;

                return `
                    <div class="${cardClasses}">
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                ${checkboxHtml}
                                <span class="text-xs font-bold px-2 py-1 rounded-md border ${badgeColor}">
                                    ${escapeHtml(item.reason || 'Flagged')}
                                </span>
                                <span class="text-xs text-slate-500 font-semibold ml-auto">${escapeHtml(item.scraped_at || 'Recently')}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2 leading-tight">${escapeHtml(item.name || 'Bingo Event')}</h3>
                            <p class="text-slate-400 text-sm font-semibold mb-2">📍 ${escapeHtml(item.venue || 'Unknown Venue')} (${escapeHtml(item.city || 'N/A')}, ${escapeHtml(item.state || 'N/A')})</p>
                            <p class="text-slate-400 text-sm mb-4 line-clamp-3">${escapeHtml(item.notes || 'No description available.')}</p>
                        </div>
                        <div class="border-t border-slate-700 pt-4 mt-auto flex gap-3">
                            <a href="${escapeHtml(item.website)}" target="_blank" class="flex-1 inline-flex justify-center items-center px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl transition-colors text-sm">
                                View Event Page &rarr;
                            </a>
                            ${actionButtonHtml}
                        </div>
                    </div>
                `;
            }).join('');

            // Add change event listener to each checkbox
            const checkboxes = grid.querySelectorAll('.event-checkbox');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateSelectionCounter);
            });

            // Reset selection status
            document.getElementById('select-all').checked = false;
            document.getElementById('select-all').indeterminate = false;
            updateSelectionCounter();
        }

        async function hideEvent(name, city) {
            if (!confirm(`Are you sure you want to hide "${name}"? This will exclude it from future scraper runs.`)) {
                return;
            }
            
            const key = `hide_${name}_${city}`;
            localStorage.setItem(key, 'true');
            
            // Mark as hidden in memory
            const matchedItem = activeEvents.find(item => item.name === name && item.city === city);
            if (matchedItem) {
                matchedItem.hidden = true;
            }
            
            populateFilters();
            renderStateSidebar();
            renderEvents();
            
            try {
                const response = await fetch('/api/hide-events', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ events: [{ name, city }] })
                });
                
                if (!response.ok) {
                    console.warn('API returned error or is not running. Saved locally.');
                }
            } catch (err) {
                console.warn('Failed to communicate with local write API. Saved locally.');
            }
        }

        async function applyBulkAction() {
            const checkedBoxes = document.querySelectorAll('.event-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('Please select at least one event first.');
                return;
            }

            const action = document.getElementById('bulk-action').value;
            const events = Array.from(checkedBoxes).map(cb => ({
                name: cb.getAttribute('data-name'),
                city: cb.getAttribute('data-city')
            }));

            const confirmMsg = action === 'add' 
                ? `Are you sure you want to add these ${events.length} events to the main directory and remove them from manual review?`
                : `Are you sure you want to hide these ${events.length} events? This will exclude them from future scraper runs.`;

            if (!confirm(confirmMsg)) {
                return;
            }

            const url = action === 'add' ? '/api/approve-events' : '/api/hide-events';

            try {
                // Save locally first for instant UI response / fallback
                events.forEach(e => {
                    if (action === 'hide') {
                        const key = `hide_${e.name}_${e.city}`;
                        localStorage.setItem(key, 'true');
                        
                        const matchedItem = activeEvents.find(item => item.name === e.name && item.city === e.city);
                        if (matchedItem) {
                            matchedItem.hidden = true;
                        }
                    }
                });

                // Send request to Vite server
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ events })
                });

                if (!response.ok) {
                    console.warn('Vite local API returned error or is not running.');
                }
                
                if (action === 'add') {
                    // Update activeEvents in client by removing approved events
                    activeEvents = activeEvents.filter(item => {
                        const matched = events.some(e => e.name === item.name && e.city === item.city);
                        return !matched;
                    });
                }

                populateFilters();
                renderStateSidebar();
                renderEvents();
                alert(`Successfully completed bulk action: ${action === 'add' ? 'Added' : 'Hidden'} ${events.length} items.`);
            } catch (err) {
                console.error(err);
                alert('Bulk action completed. (Note: Saved to local storage fallback if server write API is unavailable).');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadEvents();
            
            // Set up select all checkbox
            const selectAll = document.getElementById('select-all');
            selectAll.addEventListener('change', (e) => {
                const checked = e.target.checked;
                const checkboxes = document.querySelectorAll('.event-checkbox');
                checkboxes.forEach(cb => {
                    cb.checked = checked;
                });
                updateSelectionCounter();
            });

            // Set up apply bulk action button
            document.getElementById('apply-bulk').addEventListener('click', applyBulkAction);
        });
    </script>
</body>
</html>
